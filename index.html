<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xarajat Hisoblagich</title>
<meta name="theme-color" content="#1b2a3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="splash" id="splash"><img src="logo.png" alt="" class="logo-anim"><div class="splash-title">Xarajat Hisoblagich</div><div class="splash-author">by Suhayl</div></div>

<div id="pinModal" class="overlay"><div class="sheet">
  <h3 data-i18n="pinTitle"></h3>
  <input id="pinModalInput" type="password" inputmode="numeric" maxlength="8">
  <div id="pinError" class="note bad"></div>
  <button id="pinSubmitBtn" class="btn" data-i18n="confirm"></button>
</div></div>

<header class="top">
  <div class="menu-wrap">
    <button id="menuBtn" class="icon-btn">☰</button>
    <div id="dropdownMenu" class="dropdown">
      <button id="aboutBtn" data-i18n="about"></button>
      <div class="sep"></div>
      <button data-lang="uz">🇺🇿 O'zbekcha</button>
      <button data-lang="ru">🇷🇺 Русский</button>
      <button data-lang="en">🇬🇧 English</button>
    </div>
  </div>
  <h1>Xarajat Hisoblagich</h1>
  <div class="top-r">
    <select id="currencySwitch"><option>UZS</option><option>USD</option><option>RUB</option></select>
    <button id="themeSwitch" class="icon-btn">🌙</button>
    <button id="settingsBtn" class="icon-btn">⚙️</button>
  </div>
</header>

<main>
<section id="page-home" class="page active">
  <div class="hero"><small data-i18n="balance"></small><strong id="total">0</strong><div id="monthLine" class="month-line"></div></div>
  <div class="card">
    <div class="row between"><b data-i18n="limitTitle"></b><label class="switch"><input type="checkbox" id="limitToggle"><span></span></label></div>
    <div class="row"><input type="number" id="limitInput" placeholder="UZS" inputmode="decimal"><button id="limitSaveBtn" class="btn sm" data-i18n="save"></button></div>
    <div class="bar"><i id="limitBar"></i></div><div id="limitNotice" class="note"></div>
  </div>
  <div id="catLimits" class="card"></div>
  <div class="card">
    <b data-i18n="addExpense"></b>
    <div class="row"><input id="quick" data-i18n-ph="quickPh"><button id="quickBtn" class="btn sm">⚡</button></div>
    <input id="name" data-i18n-ph="namePh">
    <div class="row"><input id="amount" type="number" inputmode="decimal" data-i18n-ph="amountPh"><select id="itemCurrency"><option>UZS</option><option>USD</option><option>RUB</option></select></div>
    <div class="row"><input id="date" type="date"><select id="category"></select><button id="addCatBtn" class="btn sm ghost">＋</button><button id="manageCatBtn" class="btn sm ghost">⚙️</button></div>
    <button id="addBtn" class="btn" data-i18n="add"></button>
  </div>
  <div class="row"><input id="search" data-i18n-ph="searchPh"><select id="filterCategory"></select></div>
  <ul id="list"></ul>
  <div class="card" id="chartCard"><canvas id="expenseChart"></canvas></div>
</section>

<section id="page-income" class="page">
  <div class="hero income"><small data-i18n="incomeThisMonth"></small><strong id="incTotal">0</strong><div id="incMonthName" class="month-line"></div></div>
  <div class="card">
    <b data-i18n="incomeTitle"></b>
    <div class="row"><input id="incAmount" type="number" inputmode="decimal" data-i18n-ph="amountPh"><select id="incCurrency"><option>UZS</option><option>USD</option><option>RUB</option></select></div>
    <input id="incNote" data-i18n-ph="noteOpt">
    <input id="incDate" type="date">
    <button id="addIncBtn" class="btn" data-i18n="addIncome"></button>
  </div>
  <ul id="incList"></ul>
</section>

<section id="page-stats" class="page">
  <div class="tabs">
    <button data-p="month" data-i18n="tabMonth"></button><button data-p="today" data-i18n="tabToday"></button>
    <button data-p="yesterday" data-i18n="tabYest"></button><button data-p="week" data-i18n="tab7"></button>
  </div>
  <div id="statDate" class="note"></div>
  <div id="statCards" class="stat-grid"></div>
  <div id="statInsights" class="card"></div>
  <div class="card"><canvas id="statsChart"></canvas></div>
  <div id="statsList" class="card"></div>
</section>

<section id="page-goals" class="page">
  <div class="card">
    <b data-i18n="goalsTitle"></b>
    <input id="goalName" data-i18n-ph="goalNamePh">
    <div class="row"><input id="goalTarget" type="number" inputmode="decimal" data-i18n-ph="goalPricePh"><select id="goalCurrency"><option>UZS</option><option>USD</option><option>RUB</option></select></div>
    <button id="addGoalBtn" class="btn" data-i18n="addGoal"></button>
  </div>
  <div id="goalList"></div>
</section>

<section id="page-settings" class="page">
  <div class="card">
    <b data-i18n="pinSection"></b>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="8" data-i18n-ph="pinPh">
    <div class="row"><button id="savePinBtn" class="btn" data-i18n="savePin"></button><button id="removePinBtn" class="btn ghost" data-i18n="removePin"></button></div>
  </div>
  <div class="card">
    <b data-i18n="recTitle"></b>
    <input id="recName" data-i18n-ph="namePh">
    <div class="row"><input id="recAmount" type="number" inputmode="decimal" data-i18n-ph="amountPh"><select id="recCur"><option>UZS</option><option>USD</option><option>RUB</option></select></div>
    <div class="row"><select id="recCat"></select><input id="recDay" type="number" min="1" max="28" data-i18n-ph="recDay"></div>
    <button id="addRecBtn" class="btn" data-i18n="recAdd"></button>
    <ul id="recList"></ul>
  </div>
  <div class="card">
    <b data-i18n="dataSection"></b>
    <div class="row wrap">
      <button id="exportJsonBtn" class="btn ghost" data-i18n="exportJson"></button>
      <button id="exportCsvBtn" class="btn ghost" data-i18n="exportCsv"></button>
      <button id="importBtn" class="btn ghost" data-i18n="importBtn"></button>
      <button id="trashBtn" class="btn ghost">🗑️ Trash</button>
    </div>
    <input id="importFile" type="file" accept=".json" hidden>
  </div>
</section>
</main>

<nav class="nav">
  <button data-page="home" class="active">🏠<span data-i18n="navHome"></span></button>
  <button data-page="income">💰<span data-i18n="navIncome"></span></button>
  <button data-page="stats">📊<span data-i18n="navStats"></span></button>
  <button data-page="goals">🎯<span data-i18n="navGoals"></span></button>
</nav>

<div id="toasts"></div>

<div id="catModal" class="overlay"><div class="sheet">
  <h3 data-i18n="newCat"></h3>
  <input id="newCatName" data-i18n-ph="catNamePh">
  <input id="newCatEmoji" maxlength="4" data-i18n-ph="emojiPh">
  <div class="row"><button id="saveCatBtn" class="btn" data-i18n="save"></button><button id="closeCatModal" class="btn ghost" data-i18n="cancel"></button></div>
</div></div>

<div id="catMgr" class="overlay"><div class="sheet">
  <h3 data-i18n="catMgr"></h3><div class="note" data-i18n="catMgrHint"></div>
  <div id="catMgrList"></div>
  <div class="row"><button id="saveCatMgrBtn" class="btn" data-i18n="save"></button><button id="closeCatMgr" class="btn ghost" data-i18n="cancel"></button></div>
</div></div>

<div id="trashModal" class="overlay"><div class="sheet">
  <h3>🗑️ Trash</h3>
  <div id="trashList"></div>
  <div class="row"><button id="emptyTrashBtn" class="btn ghost" data-i18n="emptyTrash"></button><button id="closeTrashBtn" class="btn" data-i18n="cancel"></button></div>
</div></div>

<div id="aboutModal" class="overlay"><div class="sheet">
  <h3 data-i18n="about"></h3>
  <p><b>Xarajat Hisoblagich</b> — <span data-i18n="aboutText"></span></p>
  <p><span data-i18n="dev"></span>: Suhayl<br><span data-i18n="version"></span>: 2.1.0</p>
  <p class="note">© 2026 · <span data-i18n="rights"></span></p>
  <button id="closeAboutBtn" class="btn" data-i18n="cancel"></button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>
</body>
</html>
